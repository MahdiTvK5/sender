<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}پلتفرم ارسال کانفیگ{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "dark";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div class="bg-decor" aria-hidden="true">
      <div class="grid-overlay"></div>
      <span class="blob blob-purple"></span>
      <span class="blob blob-cyan"></span>
      <span class="blob blob-fuchsia"></span>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <div class="page">
      {% block content %}{% endblock %}
    </div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
